<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ORDER VERIFICATION</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;overflow-x:hidden;font-family:'JetBrains Mono',monospace}
.grid{position:fixed;inset:0;z-index:-3;background:#000;background-size:60px 60px;background-image:linear-gradient(to right,rgba(255,255,255,0.14) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,0.14) 1px,transparent 1px)}
canvas{position:fixed;inset:0;z-index:-2}
.vignette{position:fixed;inset:0;z-index:-1;background:radial-gradient(100% 100% at 50% 50%,transparent 30%,rgba(0,0,0,0.9) 100%);pointer-events:none}
.page{position:relative;z-index:2;width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px}
.title{font-family:'Orbitron';font-weight:900;font-size:clamp(18px,5vw,26px);letter-spacing:5px;margin-bottom:18px;text-align:center;text-shadow:0 0 20px rgba(255,255,255,.6)}
.form-wrap{width:92%;max-width:480px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.02);backdrop-filter:blur(12px);padding:20px;position:relative}
.label{font-size:8px;letter-spacing:2px;color:rgba(255,255,255,.5);margin:14px 0 6px;display:block}
.input{width:100%;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.15);padding:12px;color:#fff;font-family:'JetBrains Mono';font-size:11px;outline:none;cursor:text}
.input[readonly]{cursor:pointer}
.btn{margin-top:22px;width:100%;background:#fff;color:#000;border:0;padding:12px;font-family:'Orbitron';font-size:11px;letter-spacing:3px;font-weight:900;cursor:pointer}
.success{display:none;text-align:center;padding:30px 14px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.02);margin-top:16px}
.success b{font-family:'Orbitron';font-size:18px;letter-spacing:3px}
.picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.picker-box{width:100%;max-width:400px;background:#0f0f0f;border:1px solid rgba(255,255,255,.15);max-height:75vh;display:flex;flex-direction:column;animation:popUp.25s ease}
.picker-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1);font-family:'Orbitron';font-size:10px;letter-spacing:2px}
.picker-list{overflow-y:auto;padding:10px}
.picker-item{padding:14px 12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);margin-bottom:8px;font-size:11px;cursor:pointer;display:flex;justify-content:space-between}
.picker-item:hover{background:rgba(255,255,255,.08);border-color:#fff}
.barcode-bars{display:flex;justify-content:center;align-items:flex-end;gap:1px;height:56px;margin-top:22px}
@keyframes popUp{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="grid"></div><canvas id="c"></canvas><div class="vignette"></div>
<div class="page">
<div class="title">ORDER VERIFICATION SYSTEM</div>
<div class="form-wrap">
<form id="verifyForm">
<label class="label">NAME</label>
<input class="input" id="name" placeholder="JUAN DELA CRUZ" required>
<label class="label">PRODUCT</label>
<input class="input" id="productDisplay" placeholder="TAP TO SELECT PRODUCT..." readonly required>
<input type="hidden" id="product">
<label class="label">When did you order?</label>
<input class="input" id="when" placeholder="01/01/2026" type="text" required>
<label class="label">EMAIL PROVIDED BY AGENT</label>
<input class="input" type="email" id="agentEmail" placeholder="GABSTILLEXIST@email.com" required>
<button class="btn" type="submit">SUBMIT VERIFICATION →</button>
</form>

<div id="successBox" class="success">
<b>WARRANTY ACTIVATED!</b>
<div style="font-size:12px;margin-top:14px;color:#fff;letter-spacing:1px">THANKS <span id="sName" style="font-weight:700;text-transform:uppercase"></span>!</div>
<div style="margin-top:20px">
<div style="font-size:8px;letter-spacing:2px;opacity:.5">TRANSACTION ID</div>
<div id="txId" style="font-family:'Orbitron';font-size:16px;letter-spacing:2px;color:#fff;margin-top:6px;word-break:break-all"></div>
<div id="barcode" class="barcode-bars"></div>
<div id="sEmail" style="font-family:'JetBrains Mono';font-size:9px;letter-spacing:2px;color:#fff;margin-top:14px;word-break:break-all;text-transform:uppercase;opacity:.9"></div>
</div>
<div style="margin-top:22px;border:1px dashed rgba(255,255,255,.2);padding:10px;font-size:8px;line-height:1.6;letter-spacing:1px;color:rgba(255,255,255,.6)">
SCREENSHOT THIS PAGE FOR WARRANTY<br>NO SCREENSHOT = NO WARRANTY
</div>
</div>

</div>
</div>
</div>

<div class="picker-overlay" id="pickerOverlay" onclick="if(event.target==this)closePicker()">
<div class="picker-box">
<div class="picker-head"><span>SELECT PRODUCT</span><span onclick="closePicker()" style="cursor:pointer;color:rgba(255,255,255,.5)">[X]</span></div>
<div class="picker-list" id="pickerList"></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyD9liDmojMs14xIRjMWNCDbG_soMbrhtEQ",authDomain:"premiumhub-ecc89.firebaseapp.com",projectId:"premiumhub-ecc89",storageBucket:"premiumhub-ecc89.firebasestorage.app",messagingSenderId:"382797072107",appId:"1:382797072107:web:e38700898df1c9d9e8a0ae"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

async function loadProductList(){
const q=await getDocs(collection(db,"products"));
let html="";
q.forEach(function(dc){
let d=dc.data();
if(d.dummy)return;
html+='<div class="picker-item" onclick="chooseProduct(\''+d.name.replace(/'/g,"\\'")+'\')"><span>'+d.name+'</span><span style="opacity:.4">›</span></div>';
});
document.getElementById('pickerList').innerHTML=html || "<div style='opacity:.4;padding:12px'>No products</div>";
}
loadProductList();

window.chooseProduct=function(name){
document.getElementById('product').value=name;
document.getElementById('productDisplay').value=name;
closePicker();
}
window.openPicker=function(){document.getElementById('pickerOverlay').style.display='flex';}
window.closePicker=function(){document.getElementById('pickerOverlay').style.display='none';}
document.getElementById('productDisplay').addEventListener('click',openPicker);

function generateBarcode(tx){
  const container=document.getElementById('barcode');
  container.innerHTML="";
  for(let i=0;i<38;i++){
    let isThick = (tx.charCodeAt(i % tx.length) + i) % 3 === 0;
    let bar=document.createElement('div');
    bar.style.width = isThick? '4px' : '1.5px';
    bar.style.height = '48px';
    bar.style.background = '#fff';
    bar.style.marginRight = '1px';
    container.appendChild(bar);
  }
}

document.getElementById('verifyForm').addEventListener('submit', async (e)=>{
e.preventDefault();
function genTx(){
  const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const numbers="0123456789";
  let L="", N="";
  for(let i=0;i<6;i++){ L+=letters[Math.floor(Math.random()*letters.length)]; }
  for(let i=0;i<6;i++){ N+=numbers[Math.floor(Math.random()*numbers.length)]; }
  return `${L}${N}`;
}
let tx = genTx();
let data={
name:document.getElementById('name').value.trim(),
product:document.getElementById('product').value,
when:document.getElementById('when').value.trim(),
agentEmail:document.getElementById('agentEmail').value.trim(),
transactionId: tx,
time:serverTimestamp(),
status:"DONE",
complete:true
};
if(!data.product){alert("Select product");return;}
if(!data.when){alert("Enter date 01/01/2026");return;}
try{
await addDoc(collection(db,"verifications"),data);
document.getElementById('sName').innerText=data.name;
document.getElementById('txId').innerText=tx;
document.getElementById('sEmail').innerText=data.agentEmail.toUpperCase();
generateBarcode(tx);
document.getElementById('verifyForm').style.display='none';
document.getElementById('successBox').style.display='block';
}catch(err){alert(err.message)}
});

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let w,h,vDrops=[],hDrops=[];
function resize(){
w=canvas.width=innerWidth;h=canvas.height=innerHeight;
vDrops=[];hDrops=[];
for(let l=1;l<=3;l++){for(let k=0;k<3;k++){vDrops.push({x:l*60,y:-Math.random()*h-k*300,speed:1.8+Math.random()*1.8,length:90,opacity:.9-l*.18});}}
for(let l=1;l<=3;l++){for(let k=0;k<3;k++){hDrops.push({y:l*60,x:-Math.random()*400-k*300,speed:2+Math.random()*2,length:110,opacity:.9-l*.18});}}
}
addEventListener('resize',resize);resize();
(function anim(){
ctx.clearRect(0,0,w,h);
vDrops.forEach(function(d){
let g=ctx.createLinearGradient(0,d.y-d.length,0,d.y);
g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,255,255,'+d.opacity+')');
ctx.strokeStyle=g;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(d.x,d.y-d.length);ctx.lineTo(d.x,d.y);ctx.stroke();
d.y+=d.speed;if(d.y>h+d.length)d.y=-d.length;
});
hDrops.forEach(function(d){
let g=ctx.createLinearGradient(d.x-d.length,0,d.x,0);
g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,255,255,'+d.opacity+')');
ctx.strokeStyle=g;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(d.x-d.length,d.y);ctx.lineTo(d.x,d.y);ctx.stroke();
d.x+=d.speed;if(d.x>w+d.length)d.x=-d.length;
});
requestAnimationFrame(anim)
})();
</script>
</body>
</html>
